<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Webpage Example</title>
  <style>
    /* Container styling */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #282c34;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Animated box */
    .box {
      width: 150px;
      height: 150px;
      background-color: #61dafb;
      border-radius: 15px;
      animation: bounce 2s infinite ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 0 20px #61dafb;
    }

    /* Keyframes for bounce animation */
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 0 20px #61dafb;
      }
      50% {
        transform: translateY(-50px);
        box-shadow: 0 20px 30px #21a1f1;
      }
    }

    /* Animated text fade-in */
    .fade-in-text {
      position: absolute;
      top: 20px;
      font-size: 2rem;
      animation: fadeIn 3s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="fade-in-text">Welcome to Animated Webpage!</div>
  <div class="box">Bounce</div>
</body>
